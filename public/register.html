<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Connectly</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-link">
        <div class="brand-icon">C</div>
        <span class="brand-text">Connectly</span>
      </a>
      <div>
        <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the thoughtful community on Connectly</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control" required placeholder="Elena Rostova">
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="username" class="form-control" required placeholder="elena_arch">
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" required placeholder="elena@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" required minlength="6" placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Register</button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        await auth.register({ name, username, email, password });
        window.location.href = '/';
      } catch (err) {
        alert(err.message || 'Registration failed');
      }
    });
  </script>
</body>
</html>
