<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - CONNECT</title>
  <meta name="description" content="Sign in to your CONNECT professional account.">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" href="/images/logo.svg" type="image/svg+xml">
</head>
<body style="background-color: var(--bg-app);">

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/">
          <img src="/images/logo.svg" alt="CONNECT" class="auth-logo">
        </a>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Log in to your CONNECT account</p>
      </div>

      <div id="auth-alert" class="auth-alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Username or Email</label>
          <input type="text" id="login-identifier" class="form-input" placeholder="e.g. alexrivera or alex@example.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-login-submit" class="btn-auth-submit">Sign In</button>
      </form>

      <!-- Quick Test Accounts for Evaluators -->
      <div class="demo-accounts-box">
        <div class="demo-accounts-title">Educational Evaluation Accounts (Click to test):</div>
        <div>
          <button type="button" class="demo-account-chip" data-account="alexrivera">Alex Rivera</button>
          <button type="button" class="demo-account-chip" data-account="elenavance">Elena Vance</button>
          <button type="button" class="demo-account-chip" data-account="marcuschen">Marcus Chen</button>
          <button type="button" class="demo-account-chip" data-account="sophiapatel">Sophia Patel</button>
        </div>
        <div style="font-size: 0.72rem; color: var(--text-dim); margin-top: 8px; line-height: 1.4;">
          CodeAlpha Full Stack Internship Task 2 demo. Do not use real personal passwords.
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="/register.html">Create an account</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Wire up evaluator demo account chips safely without inline attribute passwords
      document.querySelectorAll('.demo-account-chip').forEach((chip) => {
        chip.addEventListener('click', () => {
          const account = chip.getAttribute('data-account');
          if (account) {
            document.getElementById('login-identifier').value = account;
            document.getElementById('login-password').value = 'Password123!';
            document.getElementById('login-form').requestSubmit();
          }
        });
      });
      // If already logged in, redirect to feed
      if (API.getToken()) {
        try {
          const res = await API.get('/api/auth/me');
          if (res.success && res.user) {
            window.location.href = '/';
            return;
          }
        } catch {
          API.setToken(null);
        }
      }

      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('auth-alert');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.className = 'auth-alert';
        alertBox.style.display = 'none';

        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        if (!identifier || !password) {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = 'Please enter both identifier and password.';
          return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          const res = await API.post('/api/auth/login', { identifier, password });
          if (res.success && res.token) {
            API.setToken(res.token);
            API.setCurrentUser(res.user);
            alertBox.className = 'auth-alert success';
            alertBox.textContent = 'Login successful! Redirecting...';

            const urlParams = new URLSearchParams(window.location.search);
            const rawRedirect = urlParams.get('redirect') || '/';
            // Security: Strictly enforce relative local paths to prevent Open Redirect phishing
            let targetRedirect = '/';
            if (rawRedirect.startsWith('/') && !rawRedirect.startsWith('//') && !rawRedirect.includes('\\') && !rawRedirect.includes('://')) {
              targetRedirect = rawRedirect;
            }
            setTimeout(() => {
              window.location.href = targetRedirect;
            }, 400);
          }
        } catch (err) {
          alertBox.className = 'auth-alert error';
          alertBox.textContent = err.message || 'Login failed. Please check credentials.';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
