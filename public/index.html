<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connectly — Minimalist Social Platform</title>
  <link rel="stylesheet" href="/styles/style.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="/" class="brand-link">
        <div class="brand-icon">C</div>
        <span class="brand-text">Connectly</span>
      </a>

      <div class="search-bar">
        <input type="text" placeholder="Search people..." class="search-input" id="search-input">
      </div>

      <div class="nav-actions" id="user-nav-action">
        <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
        <a href="/register.html" class="btn btn-primary btn-sm">Sign Up</a>
      </div>
    </div>
  </header>

  <div class="app-container">
    <aside class="sidebar">
      <div class="card">
        <div class="card-title">Navigation</div>
        <div style="display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.85rem;">
          <a href="/" style="color: var(--primary-sage); font-weight: 600;">Home Feed</a>
          <a href="/profile.html" style="color: var(--text-secondary);">My Profile</a>
        </div>
      </div>
    </aside>

    <main class="main-feed">
      <!-- Create Post Box -->
      <div class="card">
        <div class="card-title">Share a Reflection</div>
        <form id="create-post-form">
          <div class="form-group">
            <textarea id="post-content" rows="3" class="form-control" placeholder="What are you exploring today?" required></textarea>
          </div>
          <div class="form-group">
            <input type="url" id="post-image" class="form-control" placeholder="Image URL (optional)">
          </div>
          <div style="display: flex; justify-content: flex-end;">
            <button type="submit" class="btn btn-primary btn-sm">Publish</button>
          </div>
        </form>
      </div>

      <!-- Feed Container -->
      <div id="posts-feed" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="card" style="text-align: center; color: var(--text-muted);">
          Loading feed...
        </div>
      </div>
    </main>

    <aside class="rightbar">
      <div class="card">
        <div class="card-title">About Connectly</div>
        <p style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5;">
          A mindful social space built for CodeAlpha Full Stack Internship Task 2 with Express, MongoDB, and minimalist design.
        </p>
      </div>
    </aside>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/posts.js"></script>
  <script src="/js/comments.js"></script>
  <script src="/js/follows.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
